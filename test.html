<!DOCTYPE html>
<html>
<head>
  <title>10 Kişi Face Swap Test</title>
</head>
<body>
  <h1>10 Kişilik Face Swap Testi</h1>
  <form action="http://localhost:3000/swap-group" method="POST" enctype="multipart/form-data">
    <p>10 kişinin fotoğrafını seç (hepsini birden seçebilirsin, Ctrl'e basılı tutarak):</p>
    <input type="file" name="photos" accept="image/*" multiple required />

    <br /><br />
    <button type="submit">Karıştır ve Swap Yap</button>
  </form>
</body>
</html>
